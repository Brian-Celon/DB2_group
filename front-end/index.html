<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="container">
        <h1>Login</h1>
        <form class="login_form" id="login_Form">
            <label for="login_email">Email:</label>
            <input id="login_email" type="email" class="form_input" placeholder="Enter email address" required>

            <label for="login_password">Password:</label>
            <input id="login_password" type="password" class="form_input" placeholder="Enter your password" required>

            <button type="submit" class="btn_login">Login</button>
            <p class="account">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
