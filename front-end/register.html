<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="card">
    <h1>Register</h1>
    <form class="register_form" id="register_Form">
        <label>Full name:</label>
        <input id="full_name" type="text" class="form_input" placeholder="Enter your full name"><br>

        <label>Email:</label>
        <input id="register_email" type="email" class="form_input" placeholder="Enter email address"><br>

        <label>Password:</label>
        <input id="register_password" type="password" class="form_input" placeholder="Enter your password"><br>

        <button class="btn_login">Register</button><br>
        <p class="account">Already have an account?<a href="index.html">Login</a></p>
    </form>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
